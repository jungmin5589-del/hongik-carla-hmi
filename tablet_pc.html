<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#18212d;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:800px;margin:6vh auto;padding:30px}small{letter-spacing:.15em;color:#3e6ae1}h1{font-size:36px;letter-spacing:-.05em}p{line-height:1.8;color:#66717f}section{background:white;border-radius:22px;padding:28px;display:flex;gap:28px;align-items:center}img{width:250px;height:250px}code{display:block;font-size:40px;letter-spacing:.16em;margin:20px 0}a{color:#3e6ae1;word-break:break-all}button{border:0;background:#3e6ae1;color:white;border-radius:10px;padding:14px 20px;font:inherit}@media(max-width:650px){section{flex-direction:column}}</style>
<main><small>DRIVE · FULL NAVIGATION</small><h1>기존 내비를 아이패드에서도.</h1><p>PC와 아이패드를 같은 Wi-Fi에 연결한 뒤 QR을 스캔하세요.<br>Three.js 차량·지도·음악·홍익 AI 화면이 그대로 열립니다.</p><section><img src="/qr.png?tablet=1" alt="아이패드 전체 내비 연결 QR"><div><p>Safari에서 직접 열 때</p><a href="http://{{IP}}:{{HTTP_PORT}}/m/navigation">http://{{IP}}:{{HTTP_PORT}}/m/navigation</a><code>{{PIN}}</code><p>코드는 한 번만 사용할 수 있어요.<br>만료되면 아래에서 새로 확인하세요.</p></div></section><p>CARLA 주행은 PC에서 계산하고, 아이패드는 같은 주행 상태로 내비를 표시합니다.</p><button onclick="location.reload()">새 연결 코드 확인</button><p><a href="/connect">간단 알림·선택 화면 연결</a></p></main></html>
